<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restaurant App for Learning Azure Deployment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Restaurants (Training)</h1>
    <div id="message" class="message"></div>
    <section>
      <h2>List</h2>
      <ul id="list"></ul>
    </section>

    <section>
      <h2>Add Restaurant</h2>
      <form id="addForm">
        <input id="name" placeholder="Name" required />
        <input id="cuisine" placeholder="Cuisine" required />
        <button type="submit">Add</button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
